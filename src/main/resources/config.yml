trigger-world: THE_END
trigger-cause: VOID
pending-drops:
  # 保存时机：shutdown 仅在插件关闭时保存，immediate 在死亡/重生变更后立即保存。
  save-mode: shutdown
blacklist:
  - ELYTRA
  - SHULKER_SHELL
  - ENDER_CHEST
  - OBSIDIAN
  - ENDER_PEARL
  - END_CRYSTAL
remove-non-curse-enchant: true
burst:
  # 重生点所在格内的水平散落程度，单位：格。有效范围 [0, 0.5]。
  # 大于 0.5 会被截断为 0.5，不会跨到相邻方块。
  radius: 0.5
  merge-similar: true
  pickup-delay-ticks: 10
